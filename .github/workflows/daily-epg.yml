name: Philippines EPG refresh

on:
  schedule:
    # Run every 3 hours (UTC). This is independent of daylight-saving changes.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/daily-epg.yml"

permissions:
  contents: write

concurrency:
  group: daily-epg-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh EPG
        run: python scripts/update_epg.py
      - name: Commit updated XML when changed
        run: |
          if git diff --quiet -- pinas_epg001.xml; then
            echo "No EPG changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinas_epg001.xml
          git commit -m "EPG refresh (every 3 hours, Los Angeles time)"
          git push
